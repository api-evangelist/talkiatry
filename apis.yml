name: Talkiatry
description: >-
  Talkiatry is an online psychiatry (telepsychiatry) platform that connects patients
  with in-network, employed psychiatrists and therapists for virtual mental health care.
  Patients begin with a free online assessment that matches them to a psychiatrist, then
  attend video visits for evaluation, medication management, and talk therapy. Talkiatry
  treats conditions including ADHD, depression, anxiety, bipolar disorder, PTSD, and OCD,
  works with major insurance plans, and operates as a HIPAA-compliant, LegitScript-certified
  telehealth provider. The company is backed by a16z. As of this enrichment pass Talkiatry
  publishes a consumer telehealth website but no public developer API, API documentation,
  or developer portal.
